<!DOCTYPE html>
<!--
  CallBuddy - 調剤薬局 電話応対マニュアルツール
  ============================================
  【セットアップ手順】
  1. https://console.firebase.google.com/ で新規プロジェクトを作成する
  2. 左メニュー「構築」→「Firestore Database」を開き、データベースを作成する（本番環境モードでOK）
  3. 左メニュー「構築」→「Authentication」→「Sign-in method」で「Google」を有効化する
  4. プロジェクト設定（歯車アイコン）→「マイアプリ」→ウェブアプリを追加し、表示された
     firebaseConfig の値を、このファイル内の「firebaseConfig」プレースホルダー部分に貼り付ける
     （このファイル内を「firebaseConfig」で検索すると該当箇所にすぐ移動できます）
  5. Firestore の「ルール」タブに、下記のセキュリティルールを貼り付けて公開する

  --- Firestore セキュリティルール（コピーして使用） ---
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      match /categories/{categoryId} {
        allow read: if true;
        allow write: if request.auth != null;

        // 特定のスタッフのみ編集を許可したい場合は、上の allow write を
        // コメントアウトして下記を使う（許可したいメールアドレスを列挙する）
        // allow write: if request.auth != null &&
        //   request.auth.token.email in [
        //     'staff1@example.com',
        //     'staff2@example.com'
        //   ];
      }
    }
  }
  ------------------------------------------------------

  このアプリは HTML/CSS/JS のみで完結しており、ビルド不要でそのまま
  GitHub Pages 等の静的ホスティングに置くだけで動作します。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#eaf4fb">
<title>CallBuddy - 電話応対マニュアル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef5f9;
    --surface: #ffffff;
    --surface-2: #f5fafd;
    --border: #dbe8f0;
    --text: #33475b;
    --text-light: #6b8299;
    --primary: #9ecfe8;
    --primary-dark: #5b9bd5;
    --primary-deep: #3f7cad;
    --accent: #ffd8b8;
    --accent-dark: #f0a868;
    --step-bg: #eef1f4;
    --step-text: #5b6b7a;
    --danger: #e57373;
    --shadow: 0 2px 10px rgba(90,130,160,0.12);
    --radius: 16px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #eef5f9 0%, #f4f9fb 100%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{ max-width: 920px; margin: 0 auto; padding: 12px 14px 60px; }
  button{ font-family: inherit; cursor: pointer; }
  input, textarea{ font-family: inherit; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding: 10px 4px 14px;
  }
  .app-title{ display:flex; align-items:center; gap:10px; }
  .app-title .logo{
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    background: var(--primary); border-radius: 14px; box-shadow: var(--shadow); color:#fff;
  }
  .app-title .logo .icon-wrap svg{ width:24px; height:24px; }

  .icon-wrap{ display:inline-flex; align-items:center; justify-content:center; line-height:0; }
  .icon-wrap svg{ width:20px; height:20px; }
  .icon-wrap.inline{ vertical-align:-4px; margin-right:6px; }
  .app-title h1{ margin:0; font-size: 20px; font-weight:900; color: var(--primary-deep); letter-spacing:0.5px; }
  .app-title p{ margin:0; font-size:11px; color: var(--text-light); }

  .auth-box{ display:flex; align-items:center; gap:8px; }
  .btn{
    border:none; border-radius: 999px; padding: 8px 16px; font-size:13px; font-weight:700;
    background: var(--primary); color:#fff; box-shadow: var(--shadow); transition: transform .1s ease, opacity .15s;
  }
  .btn:hover{ opacity:.92; }
  .btn:active{ transform: scale(.97); }
  .btn.secondary{ background: var(--surface); color: var(--primary-deep); border:1px solid var(--border); }
  .btn.danger{ background: var(--danger); }
  .btn.ghost{ background: transparent; color: var(--text-light); box-shadow:none; padding:6px 10px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-sm{ padding:5px 12px; font-size:12px; }

  .user-chip{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px 10px 4px 4px; box-shadow: var(--shadow); }
  .user-chip img{ width:24px; height:24px; border-radius:50%; }
  .user-chip span{ font-size:12px; font-weight:500; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- Search ---------- */
  .search-wrap{ position:relative; margin-bottom:14px; }
  .search-box{
    display:flex; align-items:center; gap:8px; background: var(--surface);
    border: 2px solid var(--primary); border-radius: 999px; padding: 10px 16px;
    box-shadow: var(--shadow);
  }
  .search-box .icon-wrap{ color: var(--primary-dark); }
  .search-box .icon-wrap svg{ width:19px; height:19px; }
  .search-box input{
    flex:1; border:none; outline:none; font-size:16px; background:transparent; color:var(--text);
  }
  .search-box .clear-btn{ border:none; background:none; color:var(--text-light); font-size:16px; padding:2px 6px; display:none; }
  .search-results{
    position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--surface);
    border-radius: 14px; box-shadow: 0 8px 24px rgba(70,100,130,0.18); z-index: 50; overflow:hidden;
    display:none; max-height: 340px; overflow-y:auto;
  }
  .search-results.show{ display:block; }
  .search-result-item{ display:block; width:100%; text-align:left; padding:10px 16px; border:none; background:none; border-bottom:1px solid var(--border); }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover{ background: var(--surface-2); }
  .search-result-item .cat{ font-size:12px; color: var(--primary-deep); font-weight:700; }
  .search-result-item .snip{ font-size:13px; color: var(--text); margin-top:2px; }
  .search-empty{ padding:14px 16px; font-size:13px; color:var(--text-light); }

  /* ---------- Shortcuts ---------- */
  .shortcuts-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:18px; }
  .shortcut-card{
    background: var(--surface); border:1px solid var(--border); border-radius: 14px;
    padding: 12px 6px; display:flex; flex-direction:column; align-items:center; gap:6px;
    box-shadow: var(--shadow); text-align:center;
  }
  .shortcut-card .icon-wrap{ color: var(--primary-dark); }
  .shortcut-card .icon-wrap svg{ width:26px; height:26px; }
  .shortcut-card span:not(.icon-wrap){ font-size:11.5px; font-weight:700; color: var(--text); line-height:1.3; }
  .shortcut-card:hover{ background: var(--surface-2); }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:8px; margin-bottom:14px; background: var(--surface-2); padding:5px; border-radius: 999px; }
  .tab-btn{ flex:1; border:none; background:transparent; padding:10px 8px; border-radius:999px; font-weight:700; font-size:14px; color: var(--text-light); }
  .tab-btn.active{ background: var(--primary-dark); color:#fff; box-shadow: var(--shadow); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ---------- Cards / sections ---------- */
  .card{ background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 14px; }
  .card h3{ margin:0 0 10px; font-size:15px; color: var(--primary-deep); display:flex; align-items:center; gap:6px; }
  .card h3 .num{ background: var(--step-bg); color: var(--step-text); width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }

  /* ---------- Category grid ---------- */
  .category-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .cat-group{ margin-bottom:22px; }
  .cat-group-title{ font-size:16px; font-weight:900; color: var(--primary-deep); margin:0 0 12px; padding-bottom:6px; border-bottom:2px solid var(--primary); display:flex; align-items:center; gap:8px; }
  .cat-group-title .icon-wrap svg{ width:20px; height:20px; }
  .cat-section{ margin-bottom:14px; }
  .cat-section-title{ font-size:12.5px; font-weight:700; color: var(--text-light); margin:0 0 8px 2px; }
  .category-card{
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px; text-align:left; border:none; display:flex; flex-direction:row; align-items:center; gap:10px;
    position:relative;
  }
  .category-card:hover{ background: var(--surface-2); }
  .category-card .icon-wrap{ color: var(--primary-dark); flex-shrink:0; }
  .category-card .icon-wrap svg{ width:22px; height:22px; }
  .category-card .name{ font-size:14px; font-weight:700; color:var(--text); }
  .category-card .count{ font-size:11.5px; color: var(--text-light); }
  .category-card.custom{ border:2px dashed var(--primary); }
  .add-category-card{
    background: var(--surface-2); border:2px dashed var(--primary-dark); border-radius: var(--radius);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding: 16px;
    color: var(--primary-deep); font-weight:700; font-size:13px; min-height:96px;
  }

  /* ---------- Category detail ---------- */
  .detail-header{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .detail-header h2{ font-size:17px; margin:0; flex:1; color: var(--primary-deep); }
  .back-btn{ border:none; background: var(--surface); border:1px solid var(--border); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700; color:var(--text); box-shadow: var(--shadow); }

  .phrase-list{ list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .phrase-item{ display:flex; align-items:flex-start; gap:8px; background: var(--surface); border:1px solid var(--border); padding:10px 12px; border-radius:12px; font-size:14px; line-height:1.8; box-shadow: var(--shadow); }
  .phrase-item .txt{ flex:1; white-space:pre-wrap; }
  .phrase-heading{ font-weight:700; color: var(--primary-deep); font-size:15px; margin-bottom:8px; }
  .phrase-note{ margin-top:10px; font-size:13px; color: var(--text); line-height:1.7; background: var(--surface-2); border-radius:8px; padding:8px 10px; }
  .phrase-steps{
    list-style:none; margin:0 0 12px; padding-left:0;
    display:flex; flex-direction:column; gap:12px;
  }
  .phrase-steps li{
    display:flex; align-items:flex-start; gap:8px;
  }
  .phrase-steps li .step-num{
    flex-shrink:0; margin-top:1px;
    width:20px; height:20px; border-radius:50%;
    background: var(--step-bg); color: var(--step-text);
    font-weight:700; font-size:11.5px;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .phrase-steps li .step-txt{ flex:1; line-height:1.7; }
  .phrase-choices{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .phrase-choice{ background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .phrase-preamble{ margin-bottom:10px; }
  .phrase-branches{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .phrase-branch{ background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; text-align:left; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .phrase-branch-badge{ display:inline-flex; align-items:center; flex-shrink:0; white-space:nowrap; background: var(--accent); color:#8a4b12; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:0.2px; }
  .phrase-branch-body{ font-size:14px; line-height:1.7; flex:1; min-width:120px; }
  .phrase-del{ border:none; background:none; color: var(--danger); font-size:15px; padding:2px 4px; line-height:1; }
  .phrase-actions{ display:flex; flex-direction:column; gap:6px; align-items:center; }
  .phrase-edit-btn{ border:none; background:none; color: var(--primary-deep); font-size:11.5px; font-weight:700; padding:2px 4px; }
  .phrase-item.editing{ align-items:stretch; }
  .phrase-edit-textarea{ width:100%; min-height:320px; padding:9px 12px; border-radius:10px; border:1px solid var(--primary); font-size:14px; font-family:inherit; resize:vertical; line-height:1.6; box-sizing:border-box; }
  .phrase-edit-actions{ display:flex; gap:8px; margin-top:8px; justify-content:flex-end; }

  .add-phrase-form{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .add-phrase-form input{ flex:1; padding:9px 12px; border-radius:999px; border:1px solid var(--border); font-size:14px; }
  .add-phrase-form textarea{ width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--border); font-size:14px; font-family:inherit; resize:vertical; min-height:64px; }
  .add-phrase-form .btn{ align-self:flex-end; }

  .hours-form{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background: var(--surface-2); padding:10px 12px; border-radius:12px; margin-bottom:12px; }
  .hours-form input[type=time]{ padding:6px 8px; border-radius:8px; border:1px solid var(--border); }
  .hours-form label{ font-size:12px; color:var(--text-light); }

  .empty-hint{ font-size:13px; color: var(--text-light); padding:10px 4px; }

  /* ---------- Flow ---------- */
  .flow-box{ background: var(--surface-2); border-radius: 14px; padding:16px; margin-bottom:14px; }
  .flow-breadcrumb{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .flow-crumb{ font-size:11.5px; font-weight:700; background:var(--primary); color:#fff; padding:4px 10px; border-radius:999px; letter-spacing:0.2px; }
  .flow-question{ font-weight:700; font-size:14px; margin-bottom:10px; color: var(--primary-deep); }
  .flow-note{ font-size:12px; color: var(--text-light); white-space:pre-wrap; line-height:1.6; margin:-4px 0 12px; }
  .flow-phrase{ background:#fff; border-left:4px solid var(--primary-dark); padding:10px 14px; border-radius:8px; font-size:14.5px; margin-bottom:12px; white-space:pre-wrap; line-height:1.7; }
  .flow-options{ display:flex; flex-direction:column; gap:8px; }
  .flow-option-btn{ text-align:left; background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; font-weight:700; color: var(--text); box-shadow: var(--shadow); }
  .flow-option-btn:hover{ background: var(--primary); color:#fff; }
  .flow-steps{ list-style:none; padding:12px 14px; margin:0 0 14px; display:flex; flex-direction:column; gap:12px; background:#fff; border-radius:12px; box-shadow: var(--shadow); }
  .flow-steps li{ font-size:14px; display:flex; align-items:flex-start; gap:8px; }
  .flow-steps li .step-num{
    flex-shrink:0; margin-top:1px;
    width:20px; height:20px; border-radius:50%;
    background: var(--step-bg); color: var(--step-text);
    font-weight:700; font-size:11.5px;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .flow-steps li .step-txt{ flex:1; line-height:1.7; }
  .flow-restart{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .flow-edit-form{ background:#fff; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:4px; box-shadow: var(--shadow); }
  .flow-edit-form label{ font-size:12px; color:var(--text-light); margin:8px 0 2px; }
  .flow-edit-form label:first-child{ margin-top:0; }
  .flow-edit-input, .flow-edit-textarea{ width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--primary); font-size:14px; font-family:inherit; box-sizing:border-box; }
  .flow-edit-textarea{ min-height:70px; resize:vertical; line-height:1.6; }
  .flow-edit-option{ background: var(--surface-2); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .flow-edit-opt-label{ font-weight:700; }
  .flow-edit-opt-text{ min-height:50px; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(40,60,80,0.45); display:none; align-items:center; justify-content:center; z-index:200; padding:16px; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:18px; padding:22px; width:100%; max-width:440px; max-height:86vh; overflow-y:auto; }
  .modal h3{ margin-top:0; color: var(--primary-deep); }
  .modal label{ font-size:12.5px; color:var(--text-light); display:block; margin:12px 0 4px; }
  .modal input[type=text], .modal textarea{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); font-size:14px; resize:vertical; }
  .modal textarea{ min-height:110px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  /* ---------- Setup screen ---------- */
  .setup-screen{ background:#fff; border-radius: var(--radius); box-shadow: var(--shadow); padding:26px 22px; margin-top:20px; }
  .setup-screen h2{ color: var(--primary-deep); }
  .setup-screen pre{ background:#f3f8fb; border-radius:10px; padding:14px; font-size:12px; overflow-x:auto; white-space:pre-wrap; }
  .setup-screen ol{ font-size:14px; line-height:1.9; }
  .setup-screen code{ background:#eef5f9; padding:2px 6px; border-radius:6px; }

  /* ---------- Toast ---------- */
  .toast-container{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:400; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 12px; }
  .toast{ background: var(--text); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); max-width:92vw; }
  .toast.error{ background: var(--danger); }
  .toast.success{ background: #4caf7d; }

  .footer-actions{ display:flex; justify-content:center; margin-top:18px; }
  .lock-note{ font-size:12px; color: var(--text-light); text-align:center; margin-top:6px; }

  @media (max-width: 560px){
    .shortcuts-grid{ grid-template-columns: repeat(2, 1fr); }
    .category-grid{ grid-template-columns: 1fr; }
    .app-title h1{ font-size:18px; }
    .user-chip span{ max-width:70px; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="app-title">
      <div class="logo"><span class="icon-wrap" id="headerLogoIcon"></span></div>
      <div>
        <h1>CallBuddy</h1>
        <p>調剤薬局 電話応対マニュアル</p>
      </div>
    </div>
    <div class="auth-box" id="authBox"></div>
  </header>

  <div id="mainContent" style="display:none;">

    <div class="search-wrap">
      <div class="search-box">
        <span class="icon-wrap" id="searchIcon"></span>
        <input type="text" id="searchInput" placeholder="キーワードで検索（例: 謝罪 / 不在 / 疑義照会）" autocomplete="off">
        <button class="clear-btn" id="searchClearBtn">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="shortcuts-grid" id="shortcutsGrid"></div>

    <div class="tabs">
      <button class="tab-btn" data-tab="basicRules">基本ルール</button>
      <button class="tab-btn" data-tab="situations">シチュエーション一覧</button>
    </div>

    <!-- 基本ルール -->
    <div class="panel" id="panel-basicRules">
      <div id="basicRulesCards"></div>
    </div>

    <!-- シチュエーション一覧 -->
    <div class="panel" id="panel-situations">
      <div id="situationsList">
        <div id="categoryGrid"></div>
      </div>
      <div id="situationsDetail" style="display:none;"></div>

      <div class="footer-actions" id="resetWrap" style="display:none;">
        <button class="btn ghost" id="resetBtn">⚠ すべて初期状態にリセット</button>
      </div>
    </div>

  </div>

  <div id="setupScreenWrap"></div>

</div>

<!-- 新規カテゴリ追加モーダル -->
<div class="modal-overlay" id="addCategoryModal">
  <div class="modal">
    <h3>新規カテゴリを追加</h3>
    <label>カテゴリ名</label>
    <input type="text" id="newCategoryName" placeholder="例: 配送・宅配に関する問い合わせ">
    <label>フレーズ（1行に1つずつ入力・空欄でも可）</label>
    <textarea id="newCategoryPhrases" placeholder="恐れ入りますが、〜&#10;かしこまりました、〜"></textarea>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelAddCategory">キャンセル</button>
      <button class="btn" id="confirmAddCategory">追加する</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- Firebase SDK (CDN / モジュール形式) -->
<script type="module">

const state = {
  currentUser: null,
  categories: [],
  firestoreEmpty: true,
  loaded: false,
  activeTab: 'basicRules',
  openCategoryId: null,
  editingPhraseId: null,
  editingFlowNode: null,
  flow: { nodeStack: null, crumbs: [], leaf: null },
  basicRules: [],
  basicRulesLoaded: false,
  basicRulesExists: false,
  editingBasicPhrase: null
};
let seedAttempted = false;
let basicRulesSeedAttempted = false;
let db = null;
let auth = null;
let authReady = false;

function isConfigPlaceholder(){
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('YOUR_') === 0;
}

function h(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function stepNum(idx){
  return String(idx + 1);
}
function genId(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function getCategories(){
  return state.firestoreEmpty ? DEFAULT_CATEGORIES : state.categories;
}
function findCategory(id){
  return getCategories().find(function(c){ return c.id === id; });
}
function getBasicRules(){
  return (state.basicRulesLoaded && state.basicRulesExists) ? state.basicRules : DEFAULT_BASIC_RULES;
}
function canEdit(){
  if (!state.currentUser) return false;
  if (ALLOWED_EMAILS.length === 0) return true;
  return ALLOWED_EMAILS.indexOf(state.currentUser.email) !== -1;
}
function renderPhraseText(cat, text){
  if (!cat.businessHours) return text;
  return text.replace('{open}', cat.businessHours.open).replace('{close}', cat.businessHours.close);
}
function showToast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

/* ============================================================
   起動
   ============================================================ */
function boot(){
  if (isConfigPlaceholder()){
    renderSetupScreen();
    return;
  }
  document.getElementById('mainContent').style.display = 'block';

  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);

  onAuthStateChanged(auth, function(user){
    state.currentUser = user;
    authReady = true;
    renderAuthBox();
    renderEditGatedUI();
    maybeSeed();
    maybeSeedBasicRules();
  });

  onSnapshot(query(collection(db, 'categories'), orderBy('order')), function(snapshot){
    state.firestoreEmpty = snapshot.empty;
    state.categories = snapshot.docs.map(function(d){ return d.data(); });
    state.loaded = true;
    maybeSeed();
    renderCategoryGrid();
    if (state.openCategoryId) renderCategoryDetail(state.openCategoryId);
  }, function(err){
    showToast('データの読み込みに失敗しました: ' + err.message, 'error');
  });

  onSnapshot(doc(db, 'meta', 'basicRules'), function(snapshot){
    state.basicRulesLoaded = true;
    state.basicRulesExists = snapshot.exists();
    state.basicRules = snapshot.exists() ? (snapshot.data().sections || []) : [];
    maybeSeedBasicRules();
    renderBasicRulesPanel();
  }, function(err){
    showToast('基本ルールの読み込みに失敗しました: ' + err.message, 'error');
  });

  setupStaticUI();
}

async function maybeSeed(){
  if (seedAttempted) return;
  if (!authReady || !state.currentUser) return;
  if (!state.loaded) return;
  const existingIds = state.categories.map(function(c){ return c.id; });
  const missing = DEFAULT_CATEGORIES.filter(function(cat){ return existingIds.indexOf(cat.id) === -1; });
  if (!missing.length) return;
  seedAttempted = true;
  try{
    const batch = writeBatch(db);
    missing.forEach(function(cat){
      batch.set(doc(db, 'categories', cat.id), cat);
    });
    await batch.commit();
  }catch(e){
    seedAttempted = false;
    showToast('初期データの準備に失敗しました: ' + e.message, 'error');
  }
}

async function maybeSeedBasicRules(){
  if (basicRulesSeedAttempted) return;
  if (!authReady || !state.currentUser) return;
  if (!state.basicRulesLoaded) return;
  if (state.basicRulesExists) return;
  basicRulesSeedAttempted = true;
  try{
    await setDoc(doc(db, 'meta', 'basicRules'), { sections: DEFAULT_BASIC_RULES });
  }catch(e){
    basicRulesSeedAttempted = false;
    showToast('基本ルールの初期データ準備に失敗しました: ' + e.message, 'error');
  }
}

   ============================================================ */
function categorySearchEntries(cat){
  const entries = [];
  (cat.phrases || []).forEach(function(p){
    renderPhraseText(cat, p.text).split('\n').forEach(function(line){
      if (line.trim()) entries.push(line.trim());
    });
  });
  if (cat.kind === 'flow' && cat.flow){
    Object.keys(cat.flow.nodes).forEach(function(k){
      const node = cat.flow.nodes[k];
      if (node.question) entries.push(node.question);
      (node.options || []).forEach(function(o){ entries.push(o.label); if (o.text) entries.push(o.text); });
      (node.steps || []).forEach(function(s){ entries.push(s); });
    });
  }
  return entries;
}

function updateSearchResults(query){
  const box = document.getElementById('searchResults');
  const q = query.trim().toLowerCase();
  if (!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const results = [];
  getCategories().forEach(function(cat){
    if (cat.name.toLowerCase().indexOf(q) !== -1){
      results.push({ catId: cat.id, catName: cat.name, snippet: 'カテゴリを開く' });
    }
    categorySearchEntries(cat).forEach(function(text){
      if (text.toLowerCase().indexOf(q) !== -1 && results.length < 12){
        results.push({ catId: cat.id, catName: cat.name, snippet: text });
      }
    });
  });
  if (results.length === 0){
    box.innerHTML = '<div class="search-empty">一致するフレーズ・カテゴリが見つかりません</div>';
  } else {
    box.innerHTML = results.slice(0, 12).map(function(r){
      return '<button class="search-result-item" data-cat="' + h(r.catId) + '">' +
        '<div class="cat">' + h(r.catName) + '</div>' +
        '<div class="snip">' + h(r.snippet) + '</div></button>';
    }).join('');
    box.querySelectorAll('.search-result-item').forEach(function(btn){
      btn.onclick = function(){
        switchTab('situations');
        openCategory(btn.dataset.cat);
        box.classList.remove('show');
      };
    });
  }
  box.classList.add('show');
}

function needsFlowWrapper(text){
  let lines = text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  if (!lines.length) return true;
  if (/^【.*】$/.test(lines[0])){
    lines = lines.slice(1);
  }
  lines = lines.filter(function(l){ return l.indexOf('※') !== 0; });
  if (!lines.length) return true;
  const first = lines[0];
  if (first.indexOf('◆') === 0) return false;
  if (first.indexOf('・') === 0) return false;
  return true;
}

/* ※ で始まる行は「スタッフ向けメモ（声に出さない・チェック事項）」として分離する */
function extractStaffNotes(lines){
  const notes = [];
  const items = lines.filter(function(l){
    if (l.trim().indexOf('※') === 0){ notes.push(l.trim().replace(/^※/, '')); return false; }
    return true;
  });
  return { items: items, notes: notes };
}

function renderStaffNotes(notes){
  if (!notes.length) return '';
  return '<div class="phrase-note">' + notes.map(function(n){ return '📎 ' + h(n); }).join('<br>') + '</div>';
}

function renderPhraseBody(cat, rawText){
  const text = renderPhraseText(cat, rawText);
  const lines = text.split('\n');
  let heading = '';
  let items = lines;
  if (lines.length > 1 && /^【.*】$/.test(lines[0].trim())){
    heading = lines[0].trim();
    items = lines.slice(1);
  }
  const extracted = extractStaffNotes(items);
  items = extracted.items;
  const notes = extracted.notes;
  const hasBranches = items.some(function(l){ return l.trim().indexOf('◆') === 0; });
  const isChoice = !hasBranches && items.length > 0 && items[0].trim().indexOf('・') === 0;
  let html = '';
  if (heading) html += '<div class="phrase-heading">' + h(heading) + '</div>';
  if (hasBranches){
    const preamble = [];
    const branches = [];
    let current = null;
    items.forEach(function(l){
      const t = l.trim();
      if (!t) return;
      if (t.indexOf('◆') === 0){
        current = { label: t.replace(/^◆/, ''), lines: [] };
        branches.push(current);
      } else if (current){
        current.lines.push(t);
      } else {
        preamble.push(t);
      }
    });
    if (preamble.length > 1){
      html += '<ol class="phrase-steps">' + preamble.map(function(l, idx){ return '<li><span class="step-num">' + stepNum(idx) + '</span><span class="step-txt">' + h(l) + '</span></li>'; }).join('') + '</ol>';
    } else if (preamble.length === 1){
      html += '<div class="phrase-preamble">' + h(preamble[0]) + '</div>';
    }
    html += '<div class="phrase-branches">' + branches.map(function(b){
      return '<div class="phrase-branch">' +
        '<span class="phrase-branch-badge">' + h(b.label) + '</span>' +
        '<div class="phrase-branch-body">' + b.lines.map(h).join('<br>') + '</div>' +
        '</div>';
    }).join('') + '</div>';
  } else if (items.length > 1){
    if (isChoice){
      html += '<div class="phrase-choices">' + items.map(function(l){ return '<div class="phrase-choice">' + h(l.trim().replace(/^・/, '')) + '</div>'; }).join('') + '</div>';
    } else {
      html += '<ol class="phrase-steps">' + items.map(function(l, idx){ return '<li><span class="step-num">' + stepNum(idx) + '</span><span class="step-txt">' + h(l) + '</span></li>'; }).join('') + '</ol>';
    }
  } else {
    html += h(items[0] || '');
  }
  html += renderStaffNotes(notes);
  return html;
}

function renderPhraseListInto(cat){
  const allPhrases = cat.phrases || [];
  const beforeList = document.getElementById('phraseListBefore');
  if (beforeList){
    renderPhraseSubList(cat, beforeList, allPhrases.filter(function(p){ return p.before === true; }), false);
  }

function renderPhraseSubList(cat, list, phrases, showEmptyHint){

    return;

  list.innerHTML = phrases.map(function(p){

        '<div class="txt">' +
        '<textarea class="phrase-edit-textarea">' + h(p.text) + '</textarea>' +

        '<button class="btn btn-sm" data-id="' + h(p.id) + '" data-act="save">保存</button>' +

        '<button class="phrase-del" data-id="' + h(p.id) + '">✕</button>' +

  list.querySelectorAll('.phrase-edit-textarea').forEach(function(ta){

      ta.style.height = 'auto';

    });

  list.querySelectorAll('.phrase-del').forEach(function(btn){

      if (phraseObj) deletePhrase(cat.id, phraseObj);

    btn.onclick = function(){

      renderPhraseListInto(cat);

    btn.onclick = function(){
      state.editingPhraseId = null;
      renderPhraseListInto(cat);
    };
  });
  list.querySelectorAll('[data-act="save"]').forEach(function(btn){
    btn.onclick = async function(){
      const li = btn.closest('li');
      const textarea = li.querySelector('.phrase-edit-textarea');
      const ok = await updatePhrase(cat.id, btn.dataset.id, textarea.value);
      if (ok) state.editingPhraseId = null;
      renderPhraseListInto(findCategory(cat.id) || cat);
    };
  });
}

/* ============================================================
   不在時対応フロー（分岐タップ式）
   ============================================================ */
function renderFlow(cat){
  const box = document.getElementById('flowBox');
  if (!box) return;
  const flow = cat.flow;
  const fstate = state.flow;
  if (!fstate.nodeStack || !fstate.nodeStack.length) fstate.nodeStack = [flow.start];
  const nodeId = fstate.nodeStack[fstate.nodeStack.length - 1];
  const node = flow.nodes[nodeId];
  const lastCrumb = fstate.crumbs[fstate.crumbs.length - 1];
  const isEditing = canEdit() && !fstate.leaf && state.editingFlowNode === nodeId;

  let html = '';
  if (fstate.crumbs.length){
    html += '<div class="flow-breadcrumb">' + fstate.crumbs.map(function(c){
      return '<span class="flow-crumb">' + h(c.label) + '</span>';
    }).join('') + (fstate.leaf ? '<span class="flow-crumb">' + h(fstate.leaf.label) + '</span>' : '') + '</div>';
  }

  if (isEditing){
    html += renderFlowEditForm(node);
  } else {
    if (node.question){
      html += '<div class="flow-question">' + h(node.question) + '</div>';
    }
    if (node.note){
      html += '<div class="flow-note">' + h(node.note) + '</div>';
    }

    if (!fstate.leaf && lastCrumb && lastCrumb.text){
      html += needsFlowWrapper(lastCrumb.text)
        ? '<div class="flow-phrase">' + renderPhraseBody(cat, lastCrumb.text) + '</div>'
        : renderPhraseBody(cat, lastCrumb.text);
    }

    if (fstate.leaf){
      html += needsFlowWrapper(fstate.leaf.text || '')
        ? '<div class="flow-phrase">' + renderPhraseBody(cat, fstate.leaf.text || '') + '</div>'
        : renderPhraseBody(cat, fstate.leaf.text || '');
    } else {
      if (node.steps){
        const extracted = extractStaffNotes(node.steps);
        html += '<ol class="flow-steps">' + extracted.items.map(function(s, idx){ return '<li><span class="step-num">' + stepNum(idx) + '</span><span class="step-txt">' + h(s) + '</span></li>'; }).join('') + '</ol>';
        html += renderStaffNotes(extracted.notes);
      }
      if (node.options){
        html += '<div class="flow-options">' + node.options.map(function(o, idx){
          return '<button class="flow-option-btn" data-idx="' + idx + '">' + h(o.label) + '</button>';
        }).join('') + '</div>';
      }
    }
  }

  const canGoBack = !!fstate.leaf || fstate.nodeStack.length > 1;
  html += '<div class="flow-restart">' +
    (canGoBack ? '<button class="btn secondary btn-sm" id="flowBackBtn">← 一つ戻る</button>' : '') +
    (canEdit() && !fstate.leaf && !isEditing ? '<button class="btn secondary btn-sm" id="flowEditToggleBtn">✎ この画面を編集</button>' : '') +
    '<button class="btn secondary btn-sm" id="flowRestartBtn">↺ 最初からやり直す</button></div>';

  box.innerHTML = html;

  document.getElementById('flowRestartBtn').onclick = function(){
    state.flow = { nodeStack: [flow.start], crumbs: [], leaf: null };
    state.editingFlowNode = null;
    renderFlow(cat);
  };
  const backBtn = document.getElementById('flowBackBtn');
  if (backBtn){
    backBtn.onclick = function(){
      if (fstate.leaf){
        fstate.leaf = null;
      } else if (fstate.nodeStack.length > 1){
        fstate.nodeStack.pop();
        fstate.crumbs.pop();
      }
      renderFlow(cat);
    };
  }
  const editToggleBtn = document.getElementById('flowEditToggleBtn');
  if (editToggleBtn){
    editToggleBtn.onclick = function(){
      state.editingFlowNode = nodeId;
      renderFlow(cat);
    };
  }

  if (isEditing){
    wireFlowEditForm(cat, nodeId, node);
    return;
  }

  if (!fstate.leaf && node.options){
    box.querySelectorAll('.flow-option-btn').forEach(function(btn){
      btn.onclick = function(){
        const opt = node.options[Number(btn.dataset.idx)];
        if (opt.next){
          fstate.nodeStack.push(opt.next);
          fstate.crumbs.push({ label: opt.label, text: opt.text });
          fstate.leaf = null;
        } else {
          fstate.leaf = { label: opt.label, text: opt.text };
        }
        renderFlow(cat);
      };
    });
  }
}

function renderFlowEditForm(node){
  let html = '<div class="flow-edit-form">';
  if (node.question !== undefined){
    html += '<label>質問文</label><input type="text" id="flowEditQuestion" class="flow-edit-input" value="' + h(node.question || '') + '">';
  }
  if (node.note !== undefined){
    html += '<label>補足メモ</label><textarea id="flowEditNote" class="flow-edit-textarea">' + h(node.note || '') + '</textarea>';
  }
  if (node.steps){
    html += '<label>手順（1行に1つ）</label><textarea id="flowEditSteps" class="flow-edit-textarea">' + h(node.steps.join('\n')) + '</textarea>';
  }
  if (node.options){
    html += '<label>選択肢</label>';
    html += node.options.map(function(o, idx){
      return '<div class="flow-edit-option">' +
        '<input type="text" class="flow-edit-opt-label" data-idx="' + idx + '" value="' + h(o.label) + '" placeholder="ボタンの文言">' +
        '<textarea class="flow-edit-opt-text" data-idx="' + idx + '" placeholder="選んだ時に話す文言（省略可）">' + h(o.text || '') + '</textarea>' +
        '</div>';
    }).join('');
  }
  html += '<div class="phrase-edit-actions">' +
    '<button class="btn btn-sm" id="flowEditSaveBtn">保存</button>' +
    '<button class="btn secondary btn-sm" id="flowEditCancelBtn">キャンセル</button>' +
    '</div></div>';
  return html;
}

function wireFlowEditForm(cat, nodeId, node){
  document.querySelectorAll('.flow-edit-textarea, .flow-edit-opt-text').forEach(function(ta){
    ta.style.height = Math.max(ta.scrollHeight, 70) + 'px';
    ta.addEventListener('input', function(){
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  });
  document.getElementById('flowEditCancelBtn').onclick = function(){
    state.editingFlowNode = null;
    renderFlow(cat);
  };
  document.getElementById('flowEditSaveBtn').onclick = async function(){
    const newNode = JSON.parse(JSON.stringify(node));
    const qInput = document.getElementById('flowEditQuestion');
    if (qInput) newNode.question = qInput.value.trim();
    const noteInput = document.getElementById('flowEditNote');
    if (noteInput) newNode.note = noteInput.value.trim();
    const stepsInput = document.getElementById('flowEditSteps');
    if (stepsInput){
      newNode.steps = stepsInput.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    }
    if (newNode.options){
      document.querySelectorAll('.flow-edit-opt-label').forEach(function(inp){
        newNode.options[Number(inp.dataset.idx)].label = inp.value.trim();
      });
      document.querySelectorAll('.flow-edit-opt-text').forEach(function(ta){
        const v = ta.value.trim();
        if (v) newNode.options[Number(ta.dataset.idx)].text = v;
        else delete newNode.options[Number(ta.dataset.idx)].text;
      });
    }
    const ok = await updateFlowNode(cat.id, nodeId, newNode);
    if (ok) state.editingFlowNode = null;
    renderFlow(findCategory(cat.id) || cat);
  };
}

/* ============================================================
   Firestore 書き込み系
   ============================================================ */
async function addPhrase(categoryId, text){
  if (!canEdit()) return;
  text = (text || '').trim();
  if (!text) return;
  if (state.firestoreEmpty){ showToast('データを準備中です。数秒後にもう一度お試しください', 'error'); return; }
  try{
    await updateDoc(doc(db, 'categories', categoryId), {
      phrases: arrayUnion({ id: genId(), text: text })
    });
  }catch(e){ showToast('保存に失敗しました: ' + e.message, 'error'); }
}

async function deletePhrase(categoryId, phraseObj){
  if (!canEdit()) return;
  try{
    await updateDoc(doc(db, 'categories', categoryId), {
      phrases: arrayRemove(phraseObj)
    });
  }catch(e){ showToast('削除に失敗しました: ' + e.message, 'error'); }
}

async function updatePhrase(categoryId, phraseId, newText){
  if (!canEdit()) return false;
  newText = (newText || '').trim();
  if (!newText){ showToast('内容を入力してください', 'error'); return false; }
  const cat = findCategory(categoryId);
  if (!cat) return false;
  const newPhrases = (cat.phrases || []).map(function(p){
    return p.id === phraseId ? { id: p.id, text: newText } : p;
  });
  try{
    await updateDoc(doc(db, 'categories', categoryId), { phrases: newPhrases });
    showToast('保存しました', 'success');
    return true;
  }catch(e){ showToast('保存に失敗しました: ' + e.message, 'error'); return false; }
}

async function updateHours(categoryId, open, close){
  if (!canEdit()) return;
  try{
    await updateDoc(doc(db, 'categories', categoryId), { businessHours: { open: open, close: close } });
    showToast('受付時間を更新しました', 'success');
  }catch(e){ showToast('保存に失敗しました: ' + e.message, 'error'); }
}

async function updateFlowNode(categoryId, nodeId, newNode){
  if (!canEdit()) return false;
  const cat = findCategory(categoryId);
  if (!cat || !cat.flow) return false;
  const newFlow = JSON.parse(JSON.stringify(cat.flow));
  newFlow.nodes[nodeId] = newNode;
  try{
    await updateDoc(doc(db, 'categories', categoryId), { flow: newFlow });
    showToast('保存しました', 'success');
    return true;
  }catch(e){ showToast('保存に失敗しました: ' + e.message, 'error'); return false; }
}

async function addBasicRulePhrase(sectionId, text){
  if (!canEdit()) return false;
  text = (text || '').trim();
  if (!text) return false;
  const sections = JSON.parse(JSON.stringify(getBasicRules()));
  const sec = sections.find(function(s){ return s.id === sectionId; });
  if (!sec) return false;
  sec.phrases = sec.phrases || [];
  sec.phrases.push({ id: genId(), text: text });
  try{
    await setDoc(doc(db, 'meta', 'basicRules'), { sections: sections });
    return true;
  }catch(e){ showToast('保存に失敗しました: ' + e.message, 'error'); return false; }
}

async function deleteBasicRulePhrase(sectionId, phraseObj){
  if (!canEdit()) return;
  const sections = JSON.parse(JSON.stringify(getBasicRules()));
  const sec = sections.find(function(s){ return s.id === sectionId; });
  if (!sec) return;
  sec.phrases = (sec.phrases || []).filter(function(p){ return p.id !== phraseObj.id; });
  try{
    await setDoc(doc(db, 'meta', 'basicRules'), { sections: sections });
  }catch(e){ showToast('削除に失敗しました: ' + e.message, 'error'); }
}

async function submitAddCategory(){
  if (!canEdit()) return;
  const name = document.getElementById('newCategoryName').value.trim();
  const lines = document.getElementById('newCategoryPhrases').value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  if (!name){ showToast('カテゴリ名を入力してください', 'error'); return; }
  const phrases = lines.map(function(t){ return { id: genId(), text: t }; });
  const maxOrder = getCategories().reduce(function(m, c){ return Math.max(m, c.order || 0); }, 0);
  try{
    const ref = doc(collection(db, 'categories'));
    await setDoc(ref, {
      id: ref.id, name: name, icon: 'messageSquare', kind: 'phrases', order: maxOrder + 1,
      isDefault: false, phrases: phrases
    });
    closeAddCategoryModal();
    showToast('カテゴリを追加しました', 'success');
  }catch(e){ showToast('追加に失敗しました: ' + e.message, 'error'); }
}

async function deleteCategory(categoryId){
  if (!canEdit()) return;
  if (!confirm('このカテゴリを削除します。元に戻せません。よろしいですか？')) return;
  try{
    await deleteDoc(doc(db, 'categories', categoryId));
    closeCategory();
    showToast('カテゴリを削除しました', 'success');
  }catch(e){ showToast('削除に失敗しました: ' + e.message, 'error'); }
}

async function resetAll(){
  if (!canEdit()) return;
  if (!confirm('すべてのカテゴリを初期状態に戻します。追加・編集した内容はすべて失われます。よろしいですか？')) return;
  try{
    const snap = await getDocs(collection(db, 'categories'));
    const batch = writeBatch(db);
    snap.forEach(function(d){ batch.delete(d.ref); });
    await batch.commit();
    seedAttempted = false;
    closeCategory();
    showToast('初期状態にリセットしました', 'success');
  }catch(e){ showToast('リセットに失敗しました: ' + e.message, 'error'); }
}

/* ============================================================
   モーダル
   ============================================================ */
function openAddCategoryModal(){
  document.getElementById('newCategoryName').value = '';
  document.getElementById('newCategoryPhrases').value = '';
  document.getElementById('addCategoryModal').classList.add('show');
}
function closeAddCategoryModal(){
  document.getElementById('addCategoryModal').classList.remove('show');
}

boot();
